name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Executar testes
        run: npm run test:run

      - name: Verificar ESLint
        run: npm run lint

      - name: Gerar build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Executar verificação Maven
        run: mvn -B verify

  backend-postgres:
    name: Backend PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: arena_ci
          POSTGRES_USER: arena_ci
          # Disposable CI database only. This is not a deployment credential.
          POSTGRES_PASSWORD: arena_ci_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arena_ci -d arena_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/arena_ci
      SPRING_DATASOURCE_USERNAME: arena_ci
      SPRING_DATASOURCE_PASSWORD: arena_ci_fixture
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Verificar contratos transacionais em PostgreSQL
        run: mvn -B -Dtest=MultiProviderIntegrationTest,SportsSyncIntegrationTest,SportsSyncReviewIntegrationTest,ExternalMatchSettlementIntegrationTest,DemoScenarioIntegrationTest,PandaScoreMarketFlowIntegrationTest,DemoSecurityIntegrationTest,LiveTrainingIntegrationTest,LiveTrainingConcurrencyIntegrationTest,ProbabilityPricingIntegrationTest,SportsHistoryBackfillIntegrationTest test
