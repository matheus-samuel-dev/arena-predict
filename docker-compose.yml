name: arenapredict

services:
  postgres:
    # The persisted cluster was created with glibc collation 2.41. Keep the
    # Debian image so PostgreSQL can validate the recorded collation version;
    # Alpine/musl reports no actual version for this cluster.
    image: postgres:16
    container_name: arenapredict-postgres
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_DB: ${POSTGRES_DB:-bolao_copa}
      POSTGRES_USER: ${POSTGRES_USER:-bolao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em um .env não versionado}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bolao} -d ${POSTGRES_DB:-bolao_copa}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - arena-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arenapredict-api
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bolao_copa}
      DB_USERNAME: ${POSTGRES_USER:-bolao}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em um .env não versionado}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET em um .env não versionado}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      APP_BRAND_NAME: ${APP_BRAND_NAME:-ArenaPredict}
      APP_DEMO_ENABLED: ${APP_DEMO_ENABLED:-false}
      APP_DEMO_ADMIN_EMAIL: ${APP_DEMO_ADMIN_EMAIL:-admin@arenapredict.com}
      APP_DEMO_ADMIN_PASSWORD: ${APP_DEMO_ADMIN_PASSWORD:-}
      APP_DEMO_PARTICIPANT_EMAIL: ${APP_DEMO_PARTICIPANT_EMAIL:-jogador@arenapredict.com}
      APP_DEMO_PARTICIPANT_PASSWORD: ${APP_DEMO_PARTICIPANT_PASSWORD:-}
      APP_DEMO_LIVE_PROVIDER_ENABLED: ${APP_DEMO_LIVE_PROVIDER_ENABLED:-false}
      APP_DEMO_LIVE_SCHEDULER_ENABLED: ${APP_DEMO_LIVE_SCHEDULER_ENABLED:-false}
      APP_DEMO_LIVE_REFRESH_MS: ${APP_DEMO_LIVE_REFRESH_MS:-30000}
      APP_DEMO_LIVE_INITIAL_DELAY_MS: ${APP_DEMO_LIVE_INITIAL_DELAY_MS:-30000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - arena-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_APP_NAME: ${VITE_APP_NAME:-ArenaPredict}
        VITE_APP_SHORT_NAME: ${VITE_APP_SHORT_NAME:-Arena}
        VITE_APP_TAGLINE: ${VITE_APP_TAGLINE:-Sua leitura. Sua arena.}
        VITE_APP_DESCRIPTION: ${VITE_APP_DESCRIPTION:-Previsões esportivas, bolões e ligas com pontos exclusivamente virtuais.}
        VITE_APP_STORAGE_NAMESPACE: ${VITE_APP_STORAGE_NAMESPACE:-arena-predict}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-suporte@arenapredict.com}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-12000}
    container_name: arenapredict-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - arena-network

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-arenapredict_postgres_data}

networks:
  arena-network:
    driver: bridge
