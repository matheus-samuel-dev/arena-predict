sports:
  pricing:
    history-refresh-enabled: false
  sync:
    enabled: false
    scheduler-enabled: false
  pandascore:
    api-token: ""

spring:
  datasource:
    url: jdbc:h2:mem:arena;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

app:
  demo:
    enabled: true
    # Legacy domain suites exercise the original multi-sport fixtures. The controlled
    # journey has its own integration context with this option explicitly enabled.
    controlled-enabled: false
    live-provider-enabled: true
    live-scheduler-enabled: false
    # Scheduled demo maintenance is covered by focused unit tests. Keep its
    # background timers outside unrelated integration-test contexts.
    schedule-initial-delay-ms: 86400000
    history-initial-delay-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: teste-arena-predict-com-pelo-menos-trinta-e-dois-caracteres
    expiration-minutes: 30
